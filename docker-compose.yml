# Knowledge Manager - local/standalone stack.
#
# Container-internal ports match the other Promethean apps (backend 8000,
# frontend 8501) so one Traefik label set and one compose template covers every
# service. On the consolidated host (promethean-infra), nothing is published
# to the host at all - Traefik reaches these containers by service name over
# the shared `promethean_edge` network, joined below. For a fully standalone
# local run without the shared infra stack, add back a `ports:` mapping
# temporarily (e.g. "8010:8000" / "8511:8501") - just don't commit it.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # Explicit, globally-unique name: on the shared `promethean_edge` network,
    # every app's compose file has a service literally called "backend" -
    # without this, Compose's default same-named network alias would collide
    # across projects. This is also the exact value the-jarvis-project-agent-server's
    # KM_SERVER_URL should point at (see that repo's backend/.env.example).
    container_name: knowledge-manager-backend
    networks:
      - promethean_edge
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      # State lives on the mounted volumes, NOT inside the project directory
      # (which is what the code defaults to).
      - VECTOR_DB_PATH=/app/data/vector_index
      - USER_DB_PATH=/app/data/db/users.db
      - PORT=8000
      - API_HOST=0.0.0.0
      # Frontend calls are same-origin via the Next rewrite, so this only needs
      # to name genuine external browser callers.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - COGNITO_REGION=${COGNITO_REGION:-us-east-2}
      # Other apps' Cognito client IDs trusted to call this API on behalf of
      # their own users. This app's own COGNITO_CLIENT_ID is always trusted
      # regardless of this value - see api/cognito.py.
      - COGNITO_TRUSTED_CLIENT_IDS=${COGNITO_TRUSTED_CLIENT_IDS:-}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-100}
      - EMBEDDING_CONCURRENCY=${EMBEDDING_CONCURRENCY:-10}
    volumes:
      - vector_index:/app/data/vector_index
      - user_db:/app/data/db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./next
      dockerfile: Dockerfile
      args:
        # Consumed by next.config.ts's rewrites(), which Next evaluates at build
        # time - runtime env alone is not enough (see next/Dockerfile).
        - BACKEND_URL=http://knowledge-manager-backend:8000
        # NEXT_PUBLIC_* values are inlined into the bundle at build time - they
        # must be build args, not just runtime env, or Amplify ships unconfigured.
        - NEXT_PUBLIC_COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
        - NEXT_PUBLIC_COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
        - NEXT_PUBLIC_COGNITO_DOMAIN=${COGNITO_DOMAIN:-}
        - NEXT_PUBLIC_REDIRECT_SIGN_IN=${NEXT_PUBLIC_REDIRECT_SIGN_IN:-http://localhost:8511/auth/callback}
        - NEXT_PUBLIC_REDIRECT_SIGN_OUT=${NEXT_PUBLIC_REDIRECT_SIGN_OUT:-http://localhost:8511}
        # The unified login this app bounces through instead of showing its
        # own login page - see next/src/lib/auth/unifiedLogin.ts.
        - NEXT_PUBLIC_HOME_PORTAL_URL=${NEXT_PUBLIC_HOME_PORTAL_URL:-https://home.promethean-labs.co}
    container_name: knowledge-manager-frontend
    networks:
      - promethean_edge
    environment:
      - BACKEND_URL=http://knowledge-manager-backend:8000
      - NODE_ENV=production
      - PORT=8501
      # Also supplied at runtime for the dev-stage override: `next dev` reads
      # process.env live, unlike a production build which needs the args above.
      - NEXT_PUBLIC_COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - NEXT_PUBLIC_COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - NEXT_PUBLIC_COGNITO_DOMAIN=${COGNITO_DOMAIN:-}
      - NEXT_PUBLIC_REDIRECT_SIGN_IN=${NEXT_PUBLIC_REDIRECT_SIGN_IN:-http://localhost:8511/auth/callback}
      - NEXT_PUBLIC_REDIRECT_SIGN_OUT=${NEXT_PUBLIC_REDIRECT_SIGN_OUT:-http://localhost:8511}
      - NEXT_PUBLIC_HOME_PORTAL_URL=${NEXT_PUBLIC_HOME_PORTAL_URL:-https://home.promethean-labs.co}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.knowledge-manager.rule=Host(`knowledge-manager.promethean-labs.co`)"
      - "traefik.http.routers.knowledge-manager.entrypoints=web"
      - "traefik.http.services.knowledge-manager.loadbalancer.server.port=8501"

networks:
  # Created by promethean-infra's docker-compose.yml on the consolidated
  # host. For a fully standalone local run, comment out every `networks:`
  # block in this file (both services') and this declaration instead of
  # trying to satisfy `external: true` with nothing providing the network.
  promethean_edge:
    external: true

volumes:
  vector_index:
  user_db:
